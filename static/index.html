<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enterprise Churn Predictor</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/script.js" defer></script>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>Customer Telemetry</h2>
    <form id="churnForm" class="form-grid">
      <!-- Demographics -->
      <div class="field"><label>Gender</label><select name="gender"><option value="Male">Male</option><option value="Female">Female</option></select></div>
      <div class="field"><label>Senior Citizen</label><select name="SeniorCitizen"><option value="0">No</option><option value="1">Yes</option></select></div>
      <div class="field"><label>Partner</label><select name="Partner"><option value="No">No</option><option value="Yes">Yes</option></select></div>
      <div class="field"><label>Dependents</label><select name="Dependents"><option value="No">No</option><option value="Yes">Yes</option></select></div>
      
      <!-- Account Info -->
      <div class="field"><label>Tenure (Months)</label><input type="number" name="tenure" value="12" required min="1" max="72"></div>
      <div class="field"><label>Monthly Charges (₹)</label><input type="number" step="0.01" name="MonthlyCharges" value="79.85" required></div>
      <div class="field"><label>Contract Type</label><select name="Contract"><option value="Month-to-month">Month-to-month</option><option value="One year">One year</option><option value="Two year">Two year</option></select></div>
      <div class="field"><label>Payment Method</label><select name="PaymentMethod"><option value="Electronic check">Electronic check</option><option value="Mailed check">Mailed check</option><option value="Bank transfer (automatic)">Bank transfer (auto)</option><option value="Credit card (automatic)">Credit card (auto)</option></select></div>
      <div class="field"><label>Paperless Billing</label><select name="PaperlessBilling"><option value="Yes">Yes</option><option value="No">No</option></select></div>

      <!-- Services -->
      <div class="field"><label>Streaming TV</label><select name="StreamingTV"><option value="No">No</option><option value="Yes">Yes</option><option value="No internet service">No internet service</option></select></div>
      <div class="field"><label>Streaming Movies</label><select name="StreamingMovies"><option value="No">No</option><option value="Yes">Yes</option><option value="No internet service">No internet service</option></select></div>
      <div class="field"><label>Phone Service</label><select name="PhoneService"><option value="Yes">Yes</option><option value="No">No</option></select></div>
      <div class="field"><label>Multiple Lines</label><select name="MultipleLines"><option value="No">No</option><option value="Yes">Yes</option><option value="No phone service">No phone service</option></select></div>
      <div class="field"><label>Internet</label><select name="InternetService"><option value="Fiber optic">Fiber optic</option><option value="DSL">DSL</option><option value="No">No</option></select></div>
      <div class="field"><label>Online Backup</label><select name="OnlineBackup"><option value="No">No</option><option value="Yes">Yes</option><option value="No internet service">No internet service</option></select></div>
      <div class="field"><label>Online Security</label><select name="OnlineSecurity"><option value="No">No</option><option value="Yes">Yes</option><option value="No internet service">No internet service</option></select></div>
      <div class="field"><label>Tech Support</label><select name="TechSupport"><option value="No">No</option><option value="Yes">Yes</option><option value="No internet service">No internet service</option></select></div>
      <div class="field"><label>Device Protection</label><select name="DeviceProtection"><option value="No">No</option><option value="Yes">Yes</option><option value="No internet service">No internet service</option></select></div>

      <button type="submit">Execute Risk Analysis</button>
    </form>
  </div>

  <div class="card">
    <h2>Model Inference</h2>
    <div class="result-box" id="resultBox">
      <p style="color: var(--text-muted)">Awaiting telemetry data...</p>
    </div>
  </div>
</div>

</body>
</html>
